[package]
name = "bevy-boids"
version = "0.1.0"
edition = "2024"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
kiddo = "6"
bevy = "0.20"
bevy_panorbit_camera = "0.36"
rand = "0.10"
